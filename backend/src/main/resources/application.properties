spring.application.name=backend

# Valeurs de développement, identiques à celles de Docker Compose.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gestion_tickets}
spring.datasource.username=${POSTGRES_USER:gestion_tickets}
spring.datasource.password=${POSTGRES_PASSWORD:gestion_tickets_dev}

# Pour l'apprentissage : Hibernate crée et adapte les tables à partir des entités.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
